# Adapted from specification commit 4137e6a6cd0b34f0eb4e7bb3382c1248cf71b3d5,
# src/specification/applications/application-description.linkml.yaml.
# yaml-language-server: $schema=https://linkml.io/linkml-model/linkml_model/jsonschema/meta.schema.json
id: http://specification.margo.org/application-schema
name: HelmApplicationDescription
title: Application Description Schema
annotations:
  margo_optional_typed_nonnull: "true"
description: >-
  Schema for defining application metadata, deployment profiles, and parameters. 
  The purpose of the Application Description is to enable an application's discovery, configuration, and deployment on edge devices.
version: "1.0"
prefixes:
  linkml: https://w3id.org/linkml/
  margo: https://specification.margo.org/
  margo-common: https://raw.githubusercontent.com/Silvanoc/margo-specification/externalize-component-specs/model/
imports:
  - linkml:types
  - margo-common:application-description.linkml

default_prefix: margo

# Class Definitions
classes:
  ApplicationDescription:
    tree_root: true
    annotations:
      margo_extensions_pattern: '^x-[a-z][a-z0-9-]*-extensions(?![\s\S])'
    description: Root class for an application description.
    attributes:
      apiVersion:
        description: Identifier of the version of the API the object definition follows. Must be "v1".
        required: true
        range: string
        equals_string: v1
        rank: 10
      id:
        description: >-
          An identifier for the application. The id is used to help create unique identifiers where required, 
          such as namespaces. The id must be lower case letters and numbers and MAY contain dashes. 
          Uppercase letters, underscores and periods MUST NOT be used. The id MUST NOT be more than 200 characters.
        rank: 25
        range: string
        required: true
        pattern: '^[a-z0-9-]{1,200}(?![\s\S])'
      metadata:
        description: >-
          Metadata element specifying characteristics about the application deployment.
          See the [Metadata Attributes](#metadata-attributes) section below.
        range: Metadata
        required: true
        rank: 30
      deploymentProfiles:
        description: >-
          Deployment profiles element specifying the types of deployments the application supports. 
          See the [Deployment](#deploymentprofile-attributes) section below.
        range: DeploymentProfile
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true
        rank: 40
      parameters:
        description: >-
          Parameters element specifying the configurable parameters to use when installing, or updating, the application.
          Defined as a map where each key is the user-defined parameter name (e.g. `mysqlDatabase:`, `greeting:`, `idpName:`, `myAppEndpoint:`),
          and value would be Parameter object, i.e. map[string]Parameter.
          See the [Parameter](#parameter-attributes) section below.
        range: Parameter
        multivalued: true
        inlined: true
        inlined_as_list: false
        rank: 50
      configuration:
        description: >-
          Configuration element specifying how parameters should be displayed to the user for setting the value 
          as well as the rules to use to validate the user's input. 
          See the [Configuration](#configuration-attributes) section below.
        range: Configuration
        rank: 60

  DeploymentProfile:
    annotations:
      margo_extensions_pattern: '^x-[a-z][a-z0-9-]*-extensions(?![\s\S])'
    description: Represents a deployment configuration for the application.
    rank: 60
    attributes:
      id:
        description: >-
          An identifier for the deployment profile, given by the application developer, used to uniquely identify this deployment profile from others within this application description's scope.
        rank: 10
        range: string
        required: true
      description:
        description: >-
          This human-readable description of a deployment profile allows for providing additional context about the deployment profile. E.g., the application developer can use this to describe the deployment profile's purpose,
          such as the intended use case. Additionally, the application developer can use this to provide further details about the resources, peripherals, and interfaces required to run the application.
        rank: 20
        range: string
        required: false
      placementConstraints:
        description: >-
          Placement constraint match expressions required for the application to be placed on a workload target.
          See the [PlacementConstraints](#placementconstraints-attributes) section below.
        rank: 30
        range: PlacementConstraints
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: false
    slots:
      - key
      - components

  ComponentListFragment:
    description: Partial component list for registry examples, not a deployment profile.
    slots:
      - components

  PlacementConstraints:
    description: >-
      Placement constraint match expressions required for the application to be placed on a workload target.
    rank: 61
    attributes:
      matchExpressions:
        description: >-
          Match expressions evaluated against the workload target's reported characteristics.
        range: MatchExpression
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true
        rank: 10

  MatchExpression:
    description: An expression used to match a workload target characteristic or one of its properties.
    annotations:
      margo_selector_rules: '{"membership":["In","NotIn"],"existence":["Exists","DoesNotExist"],"numeric":["Gt","GtEq","Lt","LtEq"],"object_array":["ContainsAll","ContainsAny"]}'
    rank: 62
    rules:
      - description: "`values` MUST be present when the operator is `In`."
        preconditions:
          slot_conditions:
            operator:
              equals_string: In
        postconditions:
          slot_conditions:
            values:
              required: true
      - description: "`values` MUST be present when the operator is `NotIn`."
        preconditions:
          slot_conditions:
            operator:
              equals_string: NotIn
        postconditions:
          slot_conditions:
            values:
              required: true
      - description: "`values` MUST be present when the operator is `Gt`."
        preconditions:
          slot_conditions:
            operator:
              equals_string: Gt
        postconditions:
          slot_conditions:
            values:
              required: true
      - description: "`values` MUST be present when the operator is `Lt`."
        preconditions:
          slot_conditions:
            operator:
              equals_string: Lt
        postconditions:
          slot_conditions:
            values:
              required: true
      - description: "`values` MUST be present when the operator is `GtEq`."
        preconditions:
          slot_conditions:
            operator:
              equals_string: GtEq
        postconditions:
          slot_conditions:
            values:
              required: true
      - description: "`values` MUST be present when the operator is `LtEq`."
        preconditions:
          slot_conditions:
            operator:
              equals_string: LtEq
        postconditions:
          slot_conditions:
            values:
              required: true
      - description: "`property` MUST be present when the operator is `In`."
        preconditions:
          slot_conditions:
            operator:
              equals_string: In
        postconditions:
          slot_conditions:
            property:
              required: true
      - description: "`property` MUST be present when the operator is `NotIn`."
        preconditions:
          slot_conditions:
            operator:
              equals_string: NotIn
        postconditions:
          slot_conditions:
            property:
              required: true
      - description: "`property` MUST be present when the operator is `Gt`."
        preconditions:
          slot_conditions:
            operator:
              equals_string: Gt
        postconditions:
          slot_conditions:
            property:
              required: true
      - description: "`property` MUST be present when the operator is `GtEq`."
        preconditions:
          slot_conditions:
            operator:
              equals_string: GtEq
        postconditions:
          slot_conditions:
            property:
              required: true
      - description: "`property` MUST be present when the operator is `Lt`."
        preconditions:
          slot_conditions:
            operator:
              equals_string: Lt
        postconditions:
          slot_conditions:
            property:
              required: true
      - description: "`property` MUST be present when the operator is `LtEq`."
        preconditions:
          slot_conditions:
            operator:
              equals_string: LtEq
        postconditions:
          slot_conditions:
            property:
              required: true
      - description: "`property` MUST be present when the operator is `ContainsAll`."
        preconditions:
          slot_conditions:
            operator:
              equals_string: ContainsAll
        postconditions:
          slot_conditions:
            property:
              required: true
      - description: "`property` MUST be present when the operator is `ContainsAny`."
        preconditions:
          slot_conditions:
            operator:
              equals_string: ContainsAny
        postconditions:
          slot_conditions:
            property:
              required: true
      - description: "`itemSelector` MUST be present when the operator is `ContainsAll`."
        preconditions:
          slot_conditions:
            operator:
              equals_string: ContainsAll
        postconditions:
          slot_conditions:
            itemSelector:
              required: true
      - description: "`itemSelector` MUST be present when the operator is `ContainsAny`."
        preconditions:
          slot_conditions:
            operator:
              equals_string: ContainsAny
        postconditions:
          slot_conditions:
            itemSelector:
              required: true
    attributes:
      key:
        description: The characteristic key to match.
        range: string
        required: true
        rank: 10
      property:
        description: >-
          An RFC 6901 JSON Pointer evaluated relative to the characteristic's
          properties object. When omitted, the expression tests whether the
          characteristic identified by key exists.
        range: string
        required: false
        rank: 20
      operator:
        description: Operator used to evaluate the referenced value. See [SelectorOperator](#selectoroperator) for all permissible values.
        range: SelectorOperator
        required: true
        rank: 30
      values:
        description: Values used by the operator when required for matching expressions.
        any_of:
          - range: string
          - range: integer
          - range: double
          - range: boolean
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: false
        rank: 40
      itemSelector:
        description: Selector evaluated against array elements. Required for the `ContainsAll` or `ContainsAny` operator.
        range: ItemSelector
        required: false
        rank: 50

  ItemSelector:
    description: A set of item match expressions evaluated against array elements.
    rank: 63
    attributes:
      matchExpressions:
        description: Match expressions evaluated against an array element.
        range: ItemMatchExpression
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true
        rank: 10

  ItemMatchExpression:
    description: An expression used to match a property within an array element.
    annotations:
      margo_selector_rules: '{"membership":["In","NotIn"],"existence":["Exists","DoesNotExist"],"numeric":["Gt","GtEq","Lt","LtEq"]}'
    rank: 64
    attributes:
      property:
        description: An RFC 6901 JSON Pointer evaluated relative to the array element.
        range: string
        required: true
        rank: 10
      operator:
        description: Operator used to evaluate the referenced value.
        range: SelectorOperator
        required: true
        rank: 20
      values:
        description: Values used by the operator when required for matching expressions.
        any_of:
          - range: string
          - range: integer
          - range: double
          - range: boolean
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: false
        rank: 30

  HelmDeploymentProfile:
    is_a: DeploymentProfile
    #rank: 63
    slot_usage:
      key:
        equals_string: "margo.org/deployment/helm"
        rank: 10
      components:
        range: HelmComponent
        rank: 20

  ComposeDeploymentProfile:
    is_a: DeploymentProfile
    #rank: 66
    slot_usage:
      key:
        equals_string: "margo.org/deployment/compose"
        rank: 10
      components:
        range: ComposeComponent
        rank: 20

  Component:
    annotations:
      margo_extensions_pattern: '^x-[a-z][a-z0-9-]*-extensions(?![\s\S])'
    description: A class representing a component of a deployment profile.
    rank: 70
    attributes:
      name:
        annotations:
          margo_helm_description: "The `component.name` property MUST be used as the chart name when installing Helm charts."
        description: "A unique name used to identify the component package. For helm installations the name will be used as the chart name. The name must be lower case letters and numbers and MAY contain dashes.  Uppercase letters, underscores and periods MUST NOT be used."
        required: true
        range: string
        rank: 10
      properties:
        description: >-
          A dictionary element specifying the component packages's deployment details. 
          See the [Component Properties](#componentproperties-attributes) section below.
        range: ComponentProperties
        required: true
        rank: 20

  HelmComponent:
    is_a: Component
    #rank: 73

  ComposeComponent:
    is_a: Component
    #rank: 76

  ComponentProperties:
    description: >-
      Typed component properties providing OCI coordinates
      and optional deployment behavior settings.
      Used by both Helm and Compose deployment technologies.
    rank: 80
    attributes:
      repository:
        annotations:
          margo_oci_repository: "true"
        description: >-
          OCI repository URI for the component package
          (e.g., oci://registry.example.com/org/component-name).
          MUST be a valid OCI reference using the oci:// scheme.
        rank: 10
        range: string
        required: true
        pattern: "^oci://.+"
      revision:
        description: >-
          OCI tag identifying the component version within the repository
          (e.g., "1.0.0", "2.3.1", "1.0.0-rc1", "1.0.0_build.123").
          MUST be a valid SemVer 2.0 string without a leading `v`.
          SemVer build metadata separator `+` MUST be stored as `_`
          because `+` is not a valid OCI tag character.
          Implementations comparing this value against a SemVer string
          MUST convert `_` back to `+` before comparison.
        rank: 20
        range: string
        required: true
        pattern: '^(?=.{1,128}(?![\s\S]))(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(_[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(?![\s\S])'
      wait:
        annotations:
          margo_disallow_null: "true"
          margo_helm_description: "The `component.properties.wait` indicates the workload target MUST wait until the component is deployed before moving to the next component."
        description: "Whether to wait for component installation to complete before proceeding. For Helm: waits until the release is deployed. For Compose: waits until all containers reach running state. Default is true. Only applies when multiple components are provided."
        rank: 30
        range: boolean
      timeout:
        annotations:
          margo_disallow_null: "true"
        description: >-
          Maximum time to wait for component installation to complete.
          Format is "##m##s" (e.g., "5m0s", "8m30s").
          If installation does not complete before timeout, deployment fails.
        rank: 40
        range: string
        pattern: '^\d+m\d+s(?![\s\S])'

  Parameter:
    description: >-
      Defines a configurable parameter for the application.
      This object is used to build a property bag, i.e. `parameters`, defined in application description.
      See `parameters` attribute under [ApplicationDescription Attributes](#top-level-attributes) section for better understanding.
    rank: 90
    attributes:
      name:
        description: Name of the parameter.
        rank: 10
        identifier: true
        required: true
        range: string
      value:
        description: >-
          The parameter's default value. 
          Accepted data types are string, integer, double, boolean, array[string], array[integer], array[double], array[boolean].
        rank: 20
        any_of:
          - range: boolean
          - range: integer
          - range: double
          - range: string
          - range: boolean
            multivalued: true
          - range: integer
            multivalued: true
          - range: double
            multivalued: true
          - range: string
            multivalued: true
      targets:
        description: >-
          Used to indicate which component the value should be applied to when installing, or updating, the application. 
          See the [Target](#target-attributes) section below.
        rank: 30
        range: ParameterTarget
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true

  ParameterTarget:
    description: Specifies where the parameter applies in the deployment.
    rank: 100
    attributes:
      pointer:
        annotations:
          margo_helm_description: "The `parameter.targets[].pointer` MUST use the dot notation for matching elements in the Helm chart's `values.yaml` file. This follows the same naming convention used with the --set command-line argument with the Helm install command."
        description: "The name of the parameter in the deployment configuration.  For Helm deployments, this is the dot notation for the matching element in the `values.yaml` file. This follows the same naming convention you would use with the `--set` command line argument with the `helm install` command.  For compose deployments, this is the name of the environment variable to set."
        rank: 10
        range: string
        required: true
      components:
        description: >-
          Indicates which deployment profile [component](#component-attributes the parameter target applies to. 
          The component name specified here MUST match a component name in the [deployment profiles](#deploymentprofile-attributes) section.
        rank: 20
        range: string
        multivalued: true
        required: true

slots:
  key:
    description: >-
      **Note:** This will be updated when we split out the core and deployment technology specifications.
      Defines the deployment technology key for this deployment profile.
      The allowed values are `margo.org/deployment/helm`, to indicate the deployment profile's format is Helm version 3 or Version 4 using Chart APIVersion v2 (see [special exceptions below](#helm-exceptions)), 
      `margo.org/deployment/compose` to indicate the deployment profile's format is a Compose file. 
      When installing the application on a device supporting the Kubernetes platform, all `margo.org/deployment/helm` components, 
      and only `margo.org/deployment/helm` components, will be provided to the device in same order they are listed in the application description file. 
      When installing the application on a device supporting Compose, all `margo.org/deployment/compose` components, 
      and only `margo.org/deployment/compose` components, will be provided to the device in the same order they are listed in the application description file. 
      The device will install the components in the same order they are listed in the application description file.
    range: string
    required: true
    rank: 10

  components:
    description: >-
      Component element indicating the components to deploy when installing the application. 
      See the [Component](#component-attributes) section below.
    range: Component
    multivalued: true
    required: true
    inlined: true
    inlined_as_list: true
    rank: 20

enums:
  SelectorOperator:
    permissible_values:
      In:
        description: Matches when the referenced value equals one of the supplied values.
      NotIn:
        description: Matches when the referenced value does not equal any supplied value.
      Exists:
        description: Matches when the referenced key is present.
      DoesNotExist:
        description: Matches when the referenced key is absent.
      Gt:
        description: Matches when the referenced value is greater than the supplied value.
      Lt:
        description: Matches when the referenced value is less than the supplied value.
      GtEq:
        description: Matches when the referenced value is greater than or equal to the supplied value.
      LtEq:
        description: Matches when the referenced value is less than or equal to the supplied value.
      ContainsAll:
        description: Matches when an array contains an object satisfying all item selector expressions.
      ContainsAny:
        description: Matches when an array contains an object satisfying any item selector expression.

  CpuArchitectureType:
    permissible_values:
      amd64:
        description: AMD 64-bit architecture.
      arm64:
        description: ARM 64-bit architecture.
      arm:
        description: ARM 32-bit architecture.
      riscv64:
        description: RISC-V 64-bit architecture.
      other:
        description: >-
          Any other CPU architecture not listed here. The application developer MUST provide a description of the architecture in the deployment profile's `description` field.
