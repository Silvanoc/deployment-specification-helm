# yaml-language-server: $schema=https://linkml.io/linkml-model/linkml_model/jsonschema/meta.schema.json
id: https://specification.margo.org/deployment/helm-application
name: HelmApplicationDescription
title: Application Description Schema
annotations:
  margo_optional_typed_nonnull: "true"
description: Schema for defining Helm deployment profiles.
version: "1.0"
prefixes:
  linkml: https://w3id.org/linkml/
  margo: https://specification.margo.org/
  margo-common: https://raw.githubusercontent.com/Silvanoc/margo-specification/externalize-component-specs/model/
imports:
  - linkml:types
  - margo-common:application-description.linkml
  - margo-common:oci-component-properties.linkml
default_prefix: margo
classes:
  HelmDeploymentProfile:
    is_a: DeploymentProfile
    extra_slots:
      allowed: false
    slot_usage:
      key:
        equals_string: margo.org/deployment/helm
      components:
        range: HelmComponent
  HelmComponent:
    is_a: Component
    extra_slots:
      allowed: false
    slot_usage:
      name:
        annotations:
          margo_helm_description: "The `component.name` property MUST be used as the chart name when installing Helm charts."
      properties:
        range: HelmComponentProperties
  HelmComponentProperties:
    is_a: OCIComponentProperties
    slot_usage:
      wait:
        annotations:
          margo_helm_description: "The `component.properties.wait` indicates the workload target MUST wait until the component is deployed before moving to the next component."
        description: "Whether to wait until the Helm release is deployed before proceeding. Default is true. Only applies when multiple components are provided."
  HelmParameterTarget:
    is_a: ParameterTarget
    extra_slots:
      allowed: false
    slot_usage:
      pointer:
        annotations:
          margo_helm_description: "The `parameter.targets[].pointer` MUST use the dot notation for matching elements in the Helm chart's `values.yaml` file. This follows the same naming convention used with the --set command-line argument with the Helm install command."
        description: "The name of the parameter in the Helm chart's `values.yaml` file, using the dot notation of the `--set` command line argument."
