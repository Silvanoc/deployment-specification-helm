# yaml-language-server: $schema=https://linkml.io/linkml-model/linkml_model/jsonschema/meta.schema.json
id: https://specification.margo.org/helm-profile
name: HelmProfileModel
title: Helm Profile Characteristics
description: Characteristics applicable to workload targets supporting Helm.
prefixes:
  linkml: https://w3id.org/linkml/
  margo: https://specification.margo.org/
  margo-common: https://raw.githubusercontent.com/Silvanoc/margo-specification/externalize-component-specs/model/
imports:
  - linkml:types
  - margo-common:workload-target-characteristics.linkml
default_prefix: margo

classes:
  HelmProfile:
    description: Profile containing characteristics of a Helm workload target.
    is_a: WorkloadTargetProfile
    tree_root: true
    all_of:
      - slot_conditions:
          characteristics:
            has_member:
              range: HelmDeploymentCharacteristic
      - slot_conditions:
          characteristics:
            has_member:
              range: CpuCharacteristic
      - slot_conditions:
          characteristics:
            has_member:
              range: MemoryCharacteristic
      - slot_conditions:
          characteristics:
            has_member:
              range: StorageCharacteristic
      - slot_conditions:
          characteristics:
            has_member:
              range: PeripheralsCharacteristic
      - slot_conditions:
          characteristics:
            has_member:
              range: InterfacesCharacteristic
    slot_usage:
      characteristics:
        # slot_usage replaces the inherited union, so repeat its generic ranges.
        any_of:
          - range: HelmDeploymentCharacteristic
          - range: CpuCharacteristic
          - range: MemoryCharacteristic
          - range: StorageCharacteristic
          - range: PeripheralsCharacteristic
          - range: InterfacesCharacteristic
          - range: HelmOtherCharacteristic
  HelmOtherCharacteristic:
    is_a: OtherCharacteristic
    slot_usage:
      key:
        pattern: '^(?!margo\.org/(?:deployment/helm|resource/(?:cpu|memory|storage)|peripherals|interfaces)(?![\s\S]))'
  HelmDeploymentCharacteristic:
    title: Helm Deployment Technology Support
    description: The following required characteristics indicate that a workload target can deploy Helm workloads.
    rank: 10
    annotations:
      margo_profile_kind: deployment
      margo_profile_characteristic: HelmDeploymentCharacteristic
    attributes:
      key:
        range: string
        required: true
        equals_string: margo.org/deployment/helm
      properties:
        range: HelmDeploymentProperties
        inlined: true
        required: true
  HelmDeploymentProperties:
    title: Helm Deployment Technology
    description: The properties for the Helm deployment technology will be defined after we have finished splitting the core and deployment technology specifications.
    extra_slots:
      allowed: true
